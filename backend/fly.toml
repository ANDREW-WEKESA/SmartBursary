# Fly.io configuration for SmartBursary backend
app = "smartbursary-backend"
primary_region = "fra" # Frankfurt - closest to Kenya

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # Keep machine always running
  auto_start_machines = true
  min_machines_running = 1    # Always keep 1 machine running

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[env]
  EMAIL_ENABLED = "false"
  SMTP_HOST = "smtp.gmail.com"
  SMTP_PORT = "587"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
