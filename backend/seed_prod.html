<!DOCTYPE html>
<html>
<head>
    <title>Seed Production Database</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #output { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 4px; white-space: pre-wrap; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🌱 Seed Production Database</h1>
    <p>This will populate the production database with test data.</p>
    <button id="seedBtn" onclick="seedDatabase()">Seed Database</button>
    <div id="output"></div>

    <script>
        const BASE_URL = 'https://smartbursary-backend.onrender.com';
        const output = document.getElementById('output');
        const seedBtn = document.getElementById('seedBtn');

        function log(message, className = '') {
            const p = document.createElement('div');
            p.textContent = message;
            p.className = className;
            output.appendChild(p);
        }

        async function seedDatabase() {
            seedBtn.disabled = true;
            output.innerHTML = '';
            
            try {
                log('🔑 Logging in as super admin...');
                
                const loginResponse = await fetch(`${BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@smartbursary.com',
                        password: 'ChangeMe123!'
                    })
                });

                if (!loginResponse.ok) {
                    throw new Error(`Login failed: ${loginResponse.status}`);
                }

                const loginData = await loginResponse.json();
                log('✅ Login successful!', 'success');
                log(`Token: ${loginData.token.substring(0, 20)}...`);

                log('\n🌱 Seeding database...');
                
                const seedResponse = await fetch(`${BASE_URL}/api/admin/seed-database`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${loginData.token}`
                    }
                });

                if (!seedResponse.ok) {
                    const errorText = await seedResponse.text();
                    throw new Error(`Seeding failed: ${seedResponse.status} - ${errorText}`);
                }

                const seedData = await seedResponse.json();
                log('\n✅ Seeding successful!', 'success');
                log('\n📊 Summary:');
                log(JSON.stringify(seedData, null, 2));

            } catch (error) {
                log(`\n❌ Error: ${error.message}`, 'error');
            } finally {
                seedBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
