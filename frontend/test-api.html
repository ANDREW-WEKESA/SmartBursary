<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Testing Counties API</h1>
    <button onclick="testAPI()">Test Counties Endpoint</button>
    <div id="result"></div>
    
    <script>
    async function testAPI() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '<p>Testing...</p>';
        
        try {
            const response = await fetch('https://smartbursary-backend.onrender.com/api/counties');
            const data = await response.json();
            
            resultDiv.innerHTML = `
                <h2>Success! ✅</h2>
                <p>Total counties: ${data.total}</p>
                <p>First 5: ${data.counties.slice(0, 5).join(', ')}</p>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        } catch (error) {
            resultDiv.innerHTML = `
                <h2>Error! ❌</h2>
                <p>${error.message}</p>
            `;
        }
    }
    </script>
</body>
</html>
