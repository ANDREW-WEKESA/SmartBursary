<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Location Selector</title>
    <style>
        body { font-family: system-ui; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        select { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
        .output { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🧪 Location Selector Test</h1>
    
    <div class="test-section">
        <h2>Test 1: API Endpoints</h2>
        <button onclick="testAPI()">Test Counties API</button>
        <div id="api-result" class="output"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Simple Dropdown</h2>
        <p>This tests if basic select onChange works:</p>
        <select id="simple-select" onchange="simpleTest(this)">
            <option value="">Select a test option...</option>
            <option value="option1">Option 1</option>
            <option value="option2">Option 2</option>
            <option value="option3">Option 3</option>
        </select>
        <div id="simple-result" class="output">No selection yet</div>
    </div>

    <div class="test-section">
        <h2>Test 3: County Dropdown</h2>
        <p>This loads real counties from the API:</p>
        <select id="county-select" onchange="countyTest(this)">
            <option value="">Loading...</option>
        </select>
        <div id="county-result" class="output">No county selected</div>
    </div>

    <div class="test-section">
        <h2>Test 4: State Management</h2>
        <p>Selected County: <strong id="state-county">None</strong></p>
        <p>Selected Sub-County: <strong id="state-subcounty">None</strong></p>
        <button onclick="resetState()">Reset State</button>
    </div>

    <script>
        const API_BASE = 'https://smartbursary-backend.onrender.com/api';
        
        // Test 1: API
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(`${API_BASE}/counties`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                resultDiv.innerHTML = `
                    <span class="success">✅ API Works!</span><br>
                    Total Counties: ${data.total}<br>
                    Sample: ${data.counties.slice(0, 5).join(', ')}
                `;
                
                // Also populate the county dropdown
                populateCountyDropdown(data.counties);
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            }
        }
        
        // Test 2: Simple dropdown
        function simpleTest(select) {
            const result = document.getElementById('simple-result');
            result.innerHTML = `Selected: <strong>${select.value}</strong>`;
            console.log('Simple select changed to:', select.value);
        }
        
        // Test 3: County dropdown
        function countyTest(select) {
            const result = document.getElementById('county-result');
            const value = select.value;
            
            console.log('🏛️ County selected:', value);
            result.innerHTML = `Selected County: <strong>${value}</strong>`;
            
            // Update state
            document.getElementById('state-county').textContent = value;
            
            // Load sub-counties
            if (value) {
                loadSubCounties(value);
            }
        }
        
        // Populate county dropdown
        function populateCountyDropdown(counties) {
            const select = document.getElementById('county-select');
            select.innerHTML = '<option value="">Select county...</option>';
            
            counties.forEach(county => {
                const option = document.createElement('option');
                option.value = county;
                option.textContent = county;
                select.appendChild(option);
            });
            
            console.log('✅ Populated', counties.length, 'counties');
        }
        
        // Load sub-counties
        async function loadSubCounties(county) {
            try {
                const response = await fetch(`${API_BASE}/locations/sub-counties?county=${encodeURIComponent(county)}`);
                const data = await response.json();
                console.log('Sub-counties for', county, ':', data.sub_counties.length, 'found');
            } catch (error) {
                console.error('Failed to load sub-counties:', error);
            }
        }
        
        // Reset state
        function resetState() {
            document.getElementById('state-county').textContent = 'None';
            document.getElementById('state-subcounty').textContent = 'None';
            document.getElementById('county-select').value = '';
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            console.log('🚀 Test page loaded');
            testAPI();
        });
    </script>
</body>
</html>
